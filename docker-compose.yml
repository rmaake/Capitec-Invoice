services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Capitec: Server=${DB_SERVER};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True
      Notifications__Enabled: ${CAPITEC_SCHEDULED_SIMULATIONS}
      Notifications__IntervalMinutes: ${CAPITEC_SIMULATION_INTERVAL_MINUTES}
      Notifications__WindowDays: ${CAPITEC_REMINDER_WINDOW_DAYS}
      AdminUser__Username: ${CAPITEC_ADMIN_USERNAME}
      AdminUser__Password: ${CAPITEC_ADMIN_PASSWORD}
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}

    ports:
      - "1433:1433"
    volumes:
      - capitec-data:/app/data/mssql
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${CAPITEC_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  capitec-data: